name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + Testcontainers integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Integration tests skip themselves without Docker; fail loudly instead of silently skipping here.
      - name: Docker is available for Testcontainers
        run: docker info --format '{{.ServerVersion}}'
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (docker compose)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Start the platform
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Smoke test every saga path
        run: ./scripts/e2e-smoke.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v

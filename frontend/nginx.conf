server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS, re-resolved at request time so nginx starts even before the gateway does
    # and follows it if its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API calls go to the gateway on the same origin: no CORS needed.
    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        # Appends the real client address; the gateway trusts exactly this one hop for rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Client-side routes all serve the SPA shell, which itself must never be cached stale.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}

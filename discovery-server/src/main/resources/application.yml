server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # The registry itself doesn't register or fetch (single node).
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # A one-node dev registry would otherwise refuse to evict dead instances.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000
    # Clients read a cached registry snapshot; refresh it every 5 s instead of 30 s.
    response-cache-update-interval-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

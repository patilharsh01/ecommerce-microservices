server:
  port: 8084

management:
  server:
    # Actuator on its own port, never published outside the Docker network.
    port: 9084

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  data:
    web:
      pageable:
        max-page-size: 100
  kafka:
    consumer:
      properties:
        # The simulated gateway can be told to stall for up to a minute; leave headroom.
        max.poll.interval.ms: 600000

platform:
  messaging:
    topics:
      - payment.commands
      - order.saga.replies

payment:
  simulation:
    mode: ${PAYMENT_SIMULATION_MODE:APPROVE_UNDER_LIMIT}
    approval-limit: ${PAYMENT_APPROVAL_LIMIT:50000}
    latency-ms: ${PAYMENT_LATENCY_MS:0}

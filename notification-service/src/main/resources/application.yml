server:
  port: 8085

management:
  server:
    # Actuator on its own port, never published outside the Docker network.
    port: 9085

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notificationdb}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  flyway:
    # Consumer only: needs the inbox table, not the outbox.
    locations:
      - classpath:db/migration
      - classpath:db/platform/inbox
  data:
    web:
      pageable:
        max-page-size: 100

platform:
  messaging:
    outbox:
      enabled: false
    topics:
      - order.events

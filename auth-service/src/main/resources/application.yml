server:
  port: 8081

management:
  server:
    # Actuator on its own port, never published outside the Docker network.
    port: 9081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  flyway:
    # No Kafka in this service, so no outbox or inbox tables either.
    locations:
      - classpath:db/migration

# Also configurable, without defaults on purpose:
#   SECURITY_JWT_KEY_DIRECTORY  where the signing key is persisted (unset: in-memory key)
#   SECURITY_ADMIN_EMAIL / SECURITY_ADMIN_PASSWORD  bootstrap administrator (unset: none)
security:
  jwt:
    issuer: ${JWT_ISSUER:http://auth-service}
    audience: ${JWT_AUDIENCE:ecommerce-api}
    ttl: ${JWT_TTL:60m}

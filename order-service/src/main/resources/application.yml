server:
  port: 8083

management:
  server:
    # Actuator on its own port, never published outside the Docker network.
    port: 9083

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  data:
    web:
      pageable:
        max-page-size: 100

platform:
  messaging:
    topics:
      - order.saga.replies
      - inventory.commands
      - payment.commands
      - order.events

order:
  saga:
    step-timeout: ${ORDER_SAGA_STEP_TIMEOUT:30s}
    sweep-interval: 5s
  catalog:
    base-url: ${CATALOG_BASE_URL:http://product-service}

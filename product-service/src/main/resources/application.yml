server:
  port: 8082

management:
  server:
    # Actuator on its own port, never published outside the Docker network.
    port: 9082

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/productdb}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        max-page-size: 100
  cache:
    type: redis
    cache-names: products

platform:
  messaging:
    # Consumed here, plus the replies topic this service produces to.
    topics:
      - inventory.commands
      - order.saga.replies

catalog:
  demo-data:
    enabled: ${CATALOG_DEMO_DATA:false}

# Baseline configuration for every service that depends on the platform module.
# Loaded with the LOWEST precedence (see PlatformDefaultsEnvironmentPostProcessor),
# so a service's own application.yml or an environment variable always wins.

spring:
  jpa:
    # Lazy-loading from a view is a hidden N+1 and connection-hogging trap.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that the mapping agrees with it.
      ddl-auto: validate
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/platform/outbox
      - classpath:db/platform/inbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # Idempotent producer: broker-side de-duplication and per-partition ordering across retries.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        # Fail fast so the outbox relay notices a broker outage instead of blocking for minutes.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # One consumer thread per partition (topics are created with 3 partitions).
      concurrency: 3
      # Extracts the W3C traceparent header so consumer spans join the producer's trace.
      observation-enabled: true

server:
  shutdown: graceful
  # Honour X-Forwarded-* from the gateway (e.g. so generated API docs point at the gateway).
  forward-headers-strategy: framework

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  # Metrics are scraped by Prometheus and logs go to stdout; only traces are pushed over OTLP.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
